<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="converter-container">

        <div class="header">
            <h1>Temperature Converter</h1>
            <p class="description">
                Convert temperatures between Celsius, Fahrenheit, and Kelvin.
            </p>
        </div>

        <div class="converter-box">

            <label for="temperature">Enter Temperature</label>

            <input
                type="text"
                id="temperature"
                placeholder="Enter temperature"
                autocomplete="off"
            >

            <label for="unit">Select Input Unit</label>

            <select id="unit">
                <option value="Celsius">Celsius (°C)</option>
                <option value="Fahrenheit">Fahrenheit (°F)</option>
                <option value="Kelvin">Kelvin (K)</option>
            </select>

            <button id="convertBtn">Convert Temperature</button>

            <div id="errorMessage" class="error-message"></div>

            <div id="result" class="result">
                <h2>Converted Temperature</h2>

                <div class="result-item">
                    <span>Celsius</span>
                    <strong id="celsiusResult">-- °C</strong>
                </div>

                <div class="result-item">
                    <span>Fahrenheit</span>
                    <strong id="fahrenheitResult">-- °F</strong>
                </div>

                <div class="result-item">
                    <span>Kelvin</span>
                    <strong id="kelvinResult">-- K</strong>
                </div>
            </div>

        </div>

        <footer>
            <p>© 2026 Anupriya S | Temperature Converter</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
